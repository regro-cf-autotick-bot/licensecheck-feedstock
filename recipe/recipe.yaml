context:
  version: "2026.0.3"
  python_min: "3.12"

package:
  name: licensecheck
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/l/licensecheck/licensecheck-${{ version }}.tar.gz
    sha256: b47c842da2792a9f75a7f6b8cb3b1d2ebf59eee33b1a903925fd17d3925ab6f4

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  python:
    entry_points:
      - licensecheck = licensecheck:cli
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - appdirs >=1.4.4
    - configurator >=3.2.0
    - depgathe =0.4.0
    - license-expression >=30.4.4
    - loguru >=0.7.3
    - markdown >=3.10.2
    - requests >=2.32.5
    - requests-cache >=1.3.2
    - rich >=15.0.0
    - tomli >=2.2.1

tests:
  - python:
      imports:
        - licensecheck
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - licensecheck --help

about:
  homepage: https://github.com/FHPythonUtils/LicenseCheck
  summary: Output the licenses used by dependencies and check if these are compatible with the project license
  license: MIT
  license_file: LICENSE.md
  documentation: https://github.com/FHPythonUtils/LicenseCheck/blob/master/README.md

extra:
  recipe-maintainers:
    - carlodri
